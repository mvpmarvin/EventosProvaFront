<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Cadastro de Eventos</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="style.css">

</head>

<body>
    <header class="header">
        <div class="container-header">
            <nav class="navbar navbar-expand-lg bg-body-tertiary bg-dark border-bottom border-body"
                data-bs-theme="dark">
                <div class="container">
                    <a class="navbar-brand" href="index.html">Sistema Integrado de Eventos</a>
                    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                        aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                        <span class="navbar-toggler-icon"></span>
                    </button>
                    <div class="collapse navbar-collapse" id="navbarNav">
                        <ul class="navbar-nav">
                            <li class="nav-item">
                                <a class="nav-link" href="index.html">Home</a>
                            </li>
                            <li class="nav-item">
                                <a class="nav-link" href="eventos.html">Eventos</a>
                            </li>
                            <li class="nav-item">
                                <a class="nav-link active" aria-current="page" href="cadastro.html">Inscrição</a>
                            </li>
                        </ul>
                    </div>
                </div>
            </nav>
        </div>
    </header>

    <main class="container">
        <section class="mt-5 mb-5">
            <h2>Faça sua inscrição!</h2>
            <p class="text">Preencha TODOS os campos abaixo:</p>
        
            <section class="mt-5 mb-5">
                <form id="formCadastro">
                    <div class="mb-3">
                        <label for="name" class="form-label">Nome:</label>
                        <input type="text" class="form-control" id="name" placeholder="Digite aqui seu nome completo" required>
                    </div>
                    <div class="mb-3">
                        <label for="email" class="form-label">E-mail:</label>
                        <input type="email" class="form-control" id="email" placeholder="email@mail.com" required>
                    </div>
                    <div class="mb-3">
                        <label for="telefone" class="form-label">Telefone:</label>
                        <input type="tel" class="form-control" id="telefone" placeholder="(xx) 9xxxx-xxxx" required>
                    </div>
                    <div class="mb-3">
                        <label for="evento" class="form-label">Evento de Interesse:</label>
                        <select id="evento" class="form-select" required>
                            <option value="">Selecione um evento</option>
                            <option value="1">Oficina de Programação</option>
                            <option value="2">Workshop de Design</option>
                            <option value="3">Encontro de Tecnologia</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label for="cidade" class="form-label">Cidade:</label>
                        <input type="text" class="form-control" id="cidade" placeholder="Informe sua cidade" required>
                    </div>
                    <button type="submit" class="btn btn-secondary">INSCREVER-SE</button>
                    </form>          
            </section>
        </section>

    </main>
    <footer class="container fixed-bottom">
        <div class="text-center fw-lighter align-baseline">
            <p>Desenvolvido para a avaliação sobre HTML/CSS. SENAC-SC</p>
            <p>Marcos Vinícius de Paula Moraes &copy; 2026</p>
        </div>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" defer></script>
    <script src="js/app.js"></script>
</body>
</html>
